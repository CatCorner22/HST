# The Morgue's quote bank.
#
# A newspaper's morgue is its clipping archive. This file is the only source of
# words the Morgue may present as Hunter S. Thompson's own. The Correspondent
# (the style engine) never quotes him at all; the Morgue quotes him only from
# here, word for word, with the attribution recorded below.
#
# Rules for every entry (tests/test_morgue.py enforces them):
#   - `text` runs under 15 words. Short quotation for study and commentary,
#     never a passage. Excerpts mark omissions with "...".
#   - `sources` lists at least one https URL where the wording was checked.
#   - `status` is one of:
#       verified   the wording appears in the publisher's or original outlet's
#                  copy, a reputable archive, or two independent reputable
#                  secondary sources
#       secondary  two independent copies agree, but neither meets the bar
#                  above, or the only copy is a single secondary source; the
#                  Morgue quotes it with "as reprinted in" and names the source
#       disputed   widely circulated, but the wording, the origin, or the
#                  attribution does not check out; the Morgue names the dispute
#                  and never presents the line as settled
#   - `note` is required for secondary and disputed entries.
#
# Checked 20 November 2026 against the sources listed. A quote that failed the
# check was dropped, not softened.

